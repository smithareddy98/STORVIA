
services:
  backend:
    build: ./backend
    container_name: storvia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:5000"
    env_file:
      - ./backend/.env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: storvia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: storvia-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: storvia-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data: