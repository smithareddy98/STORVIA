services:
  backend:
    build: ./backend
    container_name: storvia-backend
    ports:
      - "${BACKEND_PORT}:5000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: storvia-frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend